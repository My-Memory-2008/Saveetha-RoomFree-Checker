<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Room Finder - AI Dashboard</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-glass: rgba(22, 28, 45, 0.7);
            --border-glow: #6366f1;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        /* Decorative ambient top glow */
        body::before {
            content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 1200px; height: 350px;
            background: radial-gradient(circle at top, rgba(99, 102, 241, 0.15) 0%, rgba(16, 185, 129, 0.03) 60%, transparent 100%);
            z-index: -1; pointer-events: none;
        }

        header { width: 100%; max-width: 800px; text-align: center; margin-bottom: 32px; }
        header h1 { font-size: 36px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 8px; }
        header p { color: var(--text-secondary); font-size: 15px; }

        .control-panel {
            width: 100%; max-width: 800px; display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 24px; gap: 16px;
        }

        .btn-ai {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white; font-family: inherit; font-size: 14px; font-weight: 700;
            padding: 14px 28px; border-radius: 12px; cursor: pointer; border: none;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3); transition: all 0.2s ease;
        }
        .btn-ai:hover:not(:disabled) { transform: translateY(-1px); opacity: 0.95; }
        .btn-ai:disabled { opacity: 0.5; cursor: not-allowed; }

        .grid-container {
            width: 100%; max-width: 800px; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px;
        }

        .room-card {
            background: var(--panel-glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.06); padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); display: flex; flex-direction: column; gap: 14px;
        }

        .card-header { display: flex; justify-content: space-between; align-items: center; }
        .room-title { font-size: 22px; font-weight: 700; color: white; }
        
        .status-badge {
            padding: 6px 14px; border-radius: 9999px; font-size: 11px; font-weight: 800;
            text-transform: uppercase; background: rgba(16, 185, 129, 0.1);
            color: var(--accent-emerald); border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .schedule-details {
            font-size: 14px; line-height: 1.5; color: var(--text-secondary);
            background: rgba(0, 0, 0, 0.2); padding: 12px; border-radius: 8px;
        }

        .polling-status {
            display: none; align-items: center; gap: 10px; font-size: 13px; color: var(--accent-amber); font-weight: 600;
        }
        .spinner {
            width: 16px; height: 16px; border: 2px solid rgba(245, 158, 11, 0.2);
            border-top-color: var(--accent-amber); border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header>
        <h1>Available Spaces Registry</h1>
        <p>Showing currently unoccupied workspace modules containing no active classes or routines.</p>
    </header>

    <div class="control-panel">
        <button id="ai-btn" onclick="triggerWorkflowAI()" class="btn-ai">🤖 Trigger Qwen-AI Room Scan</button>
        <div id="polling-status" class="polling-status">
            <div class="spinner"></div>
            <span>GitHub Action Runner executing image processing loop...</span>
        </div>
    </div>

    <div id="rooms-grid" class="grid-container">
        <!-- Rendered dynamically below -->
    </div>

        <script>
        document.addEventListener("DOMContentLoaded", loadRoomRegistry);

        async function loadRoomRegistry() {
            const gridContainer = document.getElementById("rooms-grid");
            try {
                // Fetch the central compiled database file with a cache-busting timestamp
                const response = await fetch(`rooms.json?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error();
                
                const database = await response.json();
                const rooms = Object.keys(database);
                
                // Filter out busy rooms instantly. Keep only rooms marked as "Free"
                const freeRooms = rooms.filter(key => database[key].currentStatus.toLowerCase() === "free");

                if (freeRooms.length === 0) {
                    gridContainer.innerHTML = `<div class="room-card" style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 40px;">No free rooms available right now. Your AI scan shows everything is occupied or rooms.json is blank.</div>`;
                    return;
                }

                gridContainer.innerHTML = "";
                freeRooms.forEach(key => {
                    const room = database[key];
                    const card = document.createElement("div");
                    card.className = "room-card";
                    card.innerHTML = `
                        <div class="card-header">
                            <div class="room-title">Room ${room.roomNumber}</div>
                            <span class="status-badge">● Vacant & Free</span>
                        </div>
                        <div class="schedule-details">
                            <strong>Today's Routine:</strong><br>${room.upcomingTimings || "No classes or routines detected."}
                        </div>
                    `;
                    gridContainer.appendChild(card);
                });
            } catch (err) {
                gridContainer.innerHTML = `<div class="room-card" style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 40px;">No data loaded. Your rooms.json file doesn't exist yet or is empty. Please run your GitHub Action workflow first.</div>`;
            }
        }

        // Simpler feedback since you'll trigger the action via your GitHub Dashboard
        function triggerWorkflowAI() {
            alert("To refresh: Go to your GitHub repository -> Actions -> Click 'Process Single Room with Qwen AI' -> Click 'Run workflow'. It takes ~60 seconds to complete!");
        }
    </script>

</body>
</html>
