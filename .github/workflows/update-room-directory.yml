name: Update Room Directory Index

# Trigger only when files in the room-directory folder are changed
on:
  push:
    paths:
      - 'room-directory/**'
  workflow_dispatch: # Allows you to run it manually from the GitHub Actions tab

jobs:
  generate-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the updated JSON file back to the repo

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Generate Room Directory Index
      run: |
        node -e "
          const fs = require('fs');
          const dir = './room-directory';
          let files = [];
          
          if (fs.existsSync(dir)) {
            // Read folder and filter only valid image extensions
            files = fs.readdirSync(dir).filter(f => f.match(/\.(png|jpg|jpeg|webp|gif)$/i));
          }
          
          // Write the sorted list to a JSON file (pretty-printed)
          fs.writeFileSync('room-directory-index.json', JSON.stringify(files, null, 2));
          console.log('✅ Successfully indexed ' + files.length + ' images.');
        "

    - name: Commit and Push Index
      run: |
        git config --global user.name "Room Directory Bot"
        git config --global user.email "actions@github.com"
        
        git add room-directory-index.json
        
        # Only commit and push if there are actual changes to prevent empty commits
        git diff --staged --quiet || (
          git commit -m "chore: auto-update room directory image index" &&
          git push
        )
