name: Predict Future Room Openings via SmolVLM

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Selected Target Date (YYYY-MM-DD)'
        required: true
        type: string
      target_time:
        description: 'Selected Time Slot Window (HH:MM - HH:MM)' # Changed from AM/PM
        required: true
        type: string

jobs:
  run-future-inference:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository Codebase
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Node Playwright Dependency
      run: |
        npm install playwright

    - name: Install Playwright Chromium System Dependencies
      run: |
        npx playwright install chromium --with-deps

    - name: Install Ollama Core Engine
      run: |
        curl -fsSL https://ollama.com/install.sh | sh

    - name: Start Ollama Server
      run: |
        ollama serve &
        echo "Waiting for Ollama server to boot..."
        until curl -s http://127.0.0.1:11434 > /dev/null; do
          sleep 1
        done
        echo "Ollama server is up and running!"

    # - name: Download Compact Vision Model (Moondream)
    #   run: |
    #     echo "Pulling moondream (highly optimized for fast CPU inference)..."
    #     ollama pull moondream
    #     echo "Model downloaded successfully!"
    # ... (keep Ollama and Playwright setup steps) ...


    - name: Download Qwen 2.5 VL Vision Model (3B)
      run: |
        echo "Pulling Qwen 2.5 VL 3B for high-accuracy OCR..."
        ollama pull qwen2.5vl:3b
        echo "Model downloaded successfully!"

    - name: Run Playwright Scraping & Node Future Inference Script
      env:
        TARGET_DATE: ${{ inputs.target_date }}
        TARGET_TIME: ${{ inputs.target_time }}
      run: |
        node scripts/analyze_future.js

    - name: Commit and Save Fresh Future Openings Snapshot
      run: |
        git config --global user.name "Future Prediction Agent"
        git config --global user.email "actions@github.com"
        
        # Safely stash any dirty/unstaged changes to prevent rebase errors
        git stash --include-untracked || true
        git pull --rebase origin main || true
        git stash pop || true
        
        # Add only the generated data
        git add future_rooms.json room-images/
        
        # ️ CRITICAL FIX: Removed [skip ci] so Cloudflare Pages actually rebuilds the site!
        git commit -m "chore: update future rooms scan" || exit 0
        git push origin main

    - name: Upload Captured Screenshots to Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: future-room-screenshots
        path: room-images/
        retention-days: 2
