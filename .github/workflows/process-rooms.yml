name: Process Single Room with Qwen AI

on:
  workflow_dispatch:
    inputs:
      room_id:
        description: 'Scan Execution Parameter'
        required: true
        type: string

jobs:
  run-vision-inference:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install AI Vision Dependencies
      run: |
        pip install torch torchvision --index-url https://pytorch.org
        pip install transformers accelerate pillow pillow_heif

    - name: Run Python Vision Extraction Script
      run: |
        python scripts/analyze_rooms.py

    - name: Commit and Save Fresh Database Snapshot
      run: |
        git config --global user.name "Self Workflow Agent"
        git config --global user.email "actions@github.com"
        git add rooms.json
        git commit -m "Direct user triggered registry rewrite via Qwen-VL Python" || exit 0
        git push
