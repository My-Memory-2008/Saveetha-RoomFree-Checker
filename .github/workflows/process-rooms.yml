name: Process All Room Schedules with Qwen AI

on:
  workflow_dispatch:

jobs:
  run-vision-inference:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository Codebase
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install System and Playwright Dependencies
      run: |
        npm install playwright
        npx playwright install chromium --with-deps

    - name: Launch Ollama Background Engine & Download Vision Model
      run: |
        curl -fsSL https://ollama.com/install.sh | sh
        ollama serve &
        # Safe boot interval sleep parameters
        sleep 8
        # Pull the lightweight 3B parameter Qwen VL vision engine
        ollama pull qwen2.5-vl:3b

    - name: Run Playwright Scraping & Node Inference Script
      run: |
        node scripts/analyze_rooms.js

    - name: Commit and Save Fresh Database Snapshot
      run: |
        git config --global user.name "Self Workflow Agent"
        git config --global user.email "actions@github.com"
        git add rooms.json
        git commit -m "Automated all-room web scrape and Qwen-VL 3B database compile [IST Verified]" || exit 0
        git push

