name: Process All Room Schedules with Qwen AI

on:
  workflow_dispatch:

jobs:
  run-vision-inference:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository Codebase
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System and Playwright Dependencies
      run: |
        # Fix: Re-added pillow to prevent the ModuleNotFoundError: No module named 'PIL'
        pip install playwright pillow
        playwright install chromium --with-deps

    - name: Launch Ollama Background Engine & Download Model
      run: |
        curl -fsSL https://ollama.com/install.sh | sh
        ollama serve &
        # Safe boot interval sleep parameters
        sleep 8
        # Pull the ultra-fast 2.8B parameter vision engine
        ollama pull minicpm-v

    - name: Run Playwright Scraping & Inference Script
      run: |
        python scripts/analyze_rooms.py

    - name: Commit and Save Fresh Database Snapshot
      run: |
        git config --global user.name "Self Workflow Agent"
        git config --global user.email "actions@github.com"
        git add rooms.json
        git commit -m "Automated all-room web scrape and Qwen database compile [IST Time Verified]" || exit 0
        git push
