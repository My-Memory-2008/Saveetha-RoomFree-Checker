name: Process All Room Schedules with Qwen AI

on:
  workflow_dispatch: # Allows a simple 1-click trigger from your GitHub dashboard with no input popup box

jobs:
  run-vision-inference:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository Codebase
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System and AI Vision Dependencies
      run: |
        pip install torch torchvision --extra-index-url https://pytorch.org
        pip install transformers accelerate pillow playwright pillow_heif
        playwright install chromium --with-deps

    - name: Run Playwright Scraping & Python Inference Script
      run: |
        python scripts/analyze_rooms.py

    - name: Commit and Save Fresh Database Snapshot
      run: |
        git config --global user.name "Self Workflow Agent"
        git config --global user.email "actions@github.com"
        git add rooms.json
        git commit -m "Automated all-room web scrape and Qwen database compile" || exit 0
        git push
