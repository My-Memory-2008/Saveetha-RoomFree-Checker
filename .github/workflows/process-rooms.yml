name: Process Single Room with Qwen AI

on:
  workflow_dispatch:
    inputs:
      room_id:
        description: 'Scan Execution Parameter'
        required: true
        type: string

jobs:
  run-vision-inference:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Launch Ollama Infrastructure
      run: |
        curl -fsSL https://ollama.com | sh
        ollama serve &
        sleep 10

    - name: Pull Vision Model Checkpoint
      run: |
        ollama pull qwen2.5:3b

    - name: Process Processing Script
      run: |
        node scripts/analyze-single.js

    - name: Commit and Save Fresh Database Snapshot
      run: |
        git config --global user.name "Self Workflow Agent"
        git config --global user.email "actions@github.com"
        git add rooms.json
        git commit -m "Direct user triggered registry rewrite" || exit 0
        git push
